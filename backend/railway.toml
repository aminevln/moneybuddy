# ============================================================
# Railway configuration per il backend MoneyBuddy
# Docs: https://docs.railway.app/reference/config-as-code
# ============================================================

[build]
# Railway userà il Dockerfile invece di nixpacks (auto-detect)
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Health check path: Railway pinga questo URL per verificare che l'app sia su
healthcheckPath = "/health"
healthcheckTimeout = 30

# Comportamento al fallimento: ricrea il container fino a 3 volte
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3