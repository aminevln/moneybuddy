# infra/docker-compose.yml
#
# Definisce i servizi che girano in locale per lo sviluppo.
# Per far partire tutto: dalla root del progetto esegui i comandi
# del file scripts/dev.ps1 (vedi più avanti).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: moneybuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneybuddy
      POSTGRES_PASSWORD: moneybuddy_dev_password
      POSTGRES_DB: moneybuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneybuddy -d moneybuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moneybuddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
